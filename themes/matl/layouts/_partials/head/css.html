{{- with resources.Get "css/main.css" }}
  {{- if hugo.IsDevelopment }}
    <link rel="stylesheet" href="/style.css">
  {{- else }}
    {{- with . | minify | fingerprint }}
      <link rel="stylesheet" href="/style.css" integrity="{{ .Data.Integrity }}" crossorigin="anonymous">
    {{- end }}
  {{- end }}
{{- end }}
